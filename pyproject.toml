[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "event-sonification-workbench"
version = "0.1.0"
description = "A reproducible workbench for event-based sonification of annotated video datasets."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kori Flowers" }
]
dependencies = [
    "jsonschema>=4.21,<5"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6"
]

[project.scripts]
event-sonification = "event_sonification_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a configured private MOT17 or KITTI Tracking dataset"
]

[tool.ruff]
line-length = 100
target-version = "py311"
