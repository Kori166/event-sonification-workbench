name: Generate MOT17 fixture final

on:
  push:
    branches:
      - automation/generate-mot17-fixture-final
    paths:
      - .github/workflows/generate-mot17-fixture-final.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: docs/complete-mot17-fixture-milestone

      - name: Download verified source file
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            'https://huggingface.co/datasets/Drunk-guardian/MOT17/resolve/main/train/MOT17-02-DPM/gt/gt.txt?download=true' \
            --output /tmp/gt.txt
          EXPECTED_SOURCE_HASH="2e3ecb488da8886d3200d402b2b08890c6d2879923839444e9b74fa43a551440"
          ACTUAL_SOURCE_HASH="$(sha256sum /tmp/gt.txt | cut -d ' ' -f 1)"
          test "$ACTUAL_SOURCE_HASH" = "$EXPECTED_SOURCE_HASH"

      - name: Generate and commit fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/fixtures/mot17/dataset-derived
          sed -n '1p;2p;3p;601p;602p;603p;3613p;3614p;3615p;4856p;4857p;4858p' \
            /tmp/gt.txt | sed 's/\r$//' > tests/fixtures/mot17/dataset-derived/gt_fixture.txt

          test "$(wc -l < tests/fixtures/mot17/dataset-derived/gt_fixture.txt)" -eq 12
          EXPECTED_FIXTURE_HASH="a4d5ec744f02febec5a2887080cc95c2f49b09189fa600d2e37c3252210f835f"
          ACTUAL_FIXTURE_HASH="$(sha256sum tests/fixtures/mot17/dataset-derived/gt_fixture.txt | cut -d ' ' -f 1)"
          test "$ACTUAL_FIXTURE_HASH" = "$EXPECTED_FIXTURE_HASH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/mot17/dataset-derived/gt_fixture.txt
          git commit -m "test: add attributed MOT17 fixture"
          git push origin HEAD:docs/complete-mot17-fixture-milestone
