name: Generate MOT17 fixture final

on:
  push:
    branches:
      - automation/generate-mot17-fixture-final
    paths:
      - .github/workflows/generate-mot17-fixture-final.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: docs/complete-mot17-fixture-milestone

      - name: Inspect mirror path
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --connect-timeout 15 --max-time 60 \
            'https://huggingface.co/api/datasets/Drunk-guardian/MOT17/tree/main/train/MOT17-02-DPM?recursive=true&expand=false' \
            --output /tmp/tree.json
          cat /tmp/tree.json
          exit 1
