<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Implemented architecture and provenance flow</title>
  <desc id="desc">MOT17 and KITTI tracking annotations pass through dataset-specific adapters to a common event package, mapping to cues or suppressions, rendering, evaluation, and a read-only inspection workbench. Identifiers, hashes, logs and contracts preserve provenance.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .source { fill: #e0f2fe; stroke: #0369a1; }
      .stage { fill: #ecfdf5; stroke: #047857; }
      .evidence { fill: #fff7ed; stroke: #c2410c; }
      .inspect { fill: #f5f3ff; stroke: #6d28d9; }
      .box { stroke-width: 2; rx: 10; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .trace { stroke: #c2410c; stroke-width: 2; fill: none; stroke-dasharray: 8 6; }
      .label { font-family: Arial, sans-serif; fill: #0f172a; font-size: 19px; font-weight: 700; text-anchor: middle; }
      .small { font-family: Arial, sans-serif; fill: #334155; font-size: 14px; text-anchor: middle; }
      .caption { font-family: Arial, sans-serif; fill: #7c2d12; font-size: 15px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>

  <text class="label" x="150" y="55">Native annotations</text>
  <rect class="box source" x="45" y="90" width="210" height="80"/>
  <text class="label" x="150" y="122">MOT17</text>
  <text class="small" x="150" y="148">1-based frames · xywh</text>
  <rect class="box source" x="45" y="220" width="210" height="80"/>
  <text class="label" x="150" y="252">KITTI Tracking</text>
  <text class="small" x="150" y="278">0-based frames · ltrb</text>

  <rect class="box stage" x="315" y="90" width="220" height="80"/>
  <text class="label" x="425" y="121">MOT17 adapter</text>
  <text class="small" x="425" y="147">parse · convert · retain</text>
  <rect class="box stage" x="315" y="220" width="220" height="80"/>
  <text class="label" x="425" y="251">KITTI adapter</text>
  <text class="small" x="425" y="277">parse · convert · retain</text>

  <rect class="box stage" x="605" y="135" width="245" height="120"/>
  <text class="label" x="727" y="173">Common event package</text>
  <text class="small" x="727" y="201">schema 0.2.0</text>
  <text class="small" x="727" y="226">events · metadata · provenance</text>

  <rect class="box stage" x="925" y="90" width="225" height="95"/>
  <text class="label" x="1037" y="124">Deterministic mapper</text>
  <text class="small" x="1037" y="151">preset 0.1.0</text>
  <rect class="box evidence" x="925" y="225" width="225" height="105"/>
  <text class="label" x="1037" y="258">Cue package</text>
  <text class="small" x="1037" y="285">cues + suppressions</text>
  <text class="small" x="1037" y="307">trace records</text>

  <rect class="box stage" x="660" y="365" width="225" height="105"/>
  <text class="label" x="772" y="398">Renderer</text>
  <text class="small" x="772" y="425">renderer 0.1.0</text>
  <text class="small" x="772" y="448">WAV + sample render log</text>

  <rect class="box evidence" x="360" y="365" width="225" height="105"/>
  <text class="label" x="472" y="398">Technical evaluator</text>
  <text class="small" x="472" y="425">contract 0.1.0</text>
  <text class="small" x="472" y="448">canonical report</text>

  <rect class="box inspect" x="360" y="535" width="525" height="105"/>
  <text class="label" x="622" y="570">Read-only inspection workbench</text>
  <text class="small" x="622" y="597">session contract 0.1.0 · retained events, cues, audio and metrics</text>
  <text class="small" x="622" y="620">no remapping · no rerendering · no evidence mutation</text>

  <path class="arrow" d="M255 130 H315"/>
  <path class="arrow" d="M255 260 H315"/>
  <path class="arrow" d="M535 130 C570 130 570 175 605 175"/>
  <path class="arrow" d="M535 260 C570 260 570 215 605 215"/>
  <path class="arrow" d="M850 195 H890 C910 195 905 138 925 138"/>
  <path class="arrow" d="M1037 185 V225"/>
  <path class="arrow" d="M925 278 C900 278 915 417 885 417"/>
  <path class="arrow" d="M660 417 H585"/>
  <path class="arrow" d="M472 470 V535"/>
  <path class="arrow" d="M772 470 V535"/>

  <path class="trace" d="M150 335 H1037"/>
  <text class="caption" x="592" y="326">Provenance across every boundary: stable identifiers · logical origins · versioned contracts · content hashes · logs</text>
  <path class="trace" d="M150 300 V335"/>
  <path class="trace" d="M727 255 V335"/>
  <path class="trace" d="M1037 330 V335"/>
</svg>
